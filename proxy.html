
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCCA | Proxy</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .proxy-container {
      max-width: 1100px;
      margin: 45px auto;
      width: 90%;
    }

    .proxy-panel {
      background: #191b25;
      border: 1px solid #30313e;
      border-radius: 14px;
      padding: 25px;
      margin-top: 25px;
    }

    .proxy-bar {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .proxy-bar input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      background: #101116;
      border: 1px solid #393b4a;
      border-radius: 8px;
      color: white;
      outline: none;
    }

    .proxy-bar button {
      background: #5552bd;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 25px;
      cursor: pointer;
      font-weight: bold;
    }

    .proxy-bar button:hover {
      background: #6b67d6;
    }

    #proxy-status {
      color: #a8aaba;
      margin: 18px 0;
      font-size: 13px;
    }

    #proxy-frame {
      width: 100%;
      height: 600px;
      background: white;
      border: 1px solid #393b4a;
      border-radius: 10px;
    }

    .proxy-back {
      display: inline-block;
      color: #aaaaff;
      text-decoration: none;
      margin-bottom: 20px;
    }

    @media(max-width: 600px) {
      .proxy-bar {
        flex-direction: column;
      }

      .proxy-bar button {
        padding: 14px;
      }

      #proxy-frame {
        height: 450px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="index.html" class="logo">LUCCA</a>

    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="index.html#juegos">Juegos</a>
      <a href="proxy.html" class="active">Proxy</a>
    </nav>
  </header>

  <main class="proxy-container">

    <a href="index.html" class="proxy-back">
      ← Volver a LUCCA
    </a>

    <section class="welcome">
      <span class="version">LUCCA v1.0</span>
      <h1>LUCCA Proxy</h1>
      <p>Introduce una dirección web para solicitar una vista previa.</p>
    </section>

    <section class="proxy-panel">

      <h2>Navegador web</h2>

      <form class="proxy-bar" id="proxy-form">
        <input
          type="url"
          id="proxy-url"
          placeholder="https://example.com"
          required
        >

        <button type="submit">Ir</button>
      </form>

      <p id="proxy-status">
        Servidor preparado para recibir solicitudes.
      </p>

      <iframe
        id="proxy-frame"
        title="Vista previa LUCCA"
        sandbox=""
        referrerpolicy="no-referrer">
      </iframe>

    </section>

  </main>

  <footer>
    <p>LUCCA © 2026 · LUCCA Proxy</p>
    <p>Versión 1.0</p>
  </footer>

  <script>
    const PROXY_SERVER = "https://lucca-proxy.onrender.com";

    const form = document.getElementById("proxy-form");
    const input = document.getElementById("proxy-url");
    const status = document.getElementById("proxy-status");
    const frame = document.getElementById("proxy-frame");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const url = input.value.trim();

      status.textContent = "Conectando con LUCCA PROXY...";
      frame.srcdoc = "";

      try {
        const response = await fetch(
          PROXY_SERVER + "/api/fetch?url=" +
          encodeURIComponent(url)
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Error del servidor.");
        }

        frame.srcdoc = data.html;

        status.textContent =
          "Vista previa recibida correctamente.";

      } catch(error) {
        status.textContent = "Error: " + error.message;
      }
    });
  </script>

</body>
</html>
