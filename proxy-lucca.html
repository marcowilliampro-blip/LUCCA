<!DOCTYPE html>
<html lang="es">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f17;
      --bar: #14141f;
      --panel: #1a1a26;
      --line: #2a2a3c;
      --text: #e8e8f0;
      --muted: #9a9ab0;
      --accent: #6366f1;
      --accent-hover: #7477f5;
      --accent-soft: #818cf8;
      --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 var(--font);
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }

    .header {
      display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
      padding: .9rem 1.25rem;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; text-decoration: none; }
    .nav { display: flex; gap: .25rem; flex-wrap: wrap; margin-left: auto; }
    .nav a {
      padding: .4rem .8rem; border-radius: 8px; text-decoration: none;
      color: var(--muted); font-weight: 500;
    }
    .nav a:hover { color: var(--text); background: var(--panel); }
    .nav a.active { color: #fff; background: var(--accent); }

    main { width: min(100% - 2rem, 75rem); margin: 2rem auto 3rem; display: grid; gap: 1.25rem; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.25rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
    h1 span { color: var(--accent-soft); }
    .lead { margin: .5rem 0 0; color: var(--muted); max-width: 40rem; }

    .frame-wrap {
      position: relative;
      height: 78vh; min-height: 30rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    .loading {
      position: absolute; inset: 0; display: grid; place-content: center; gap: .35rem;
      text-align: center; padding: 1rem; color: var(--muted);
    }
    .loading strong { color: var(--text); font-size: 1.1rem; }
    .proxy-frame {
      position: relative; z-index: 1;
      display: block; width: 100%; height: 100%;
      border: 0; background: transparent;
    }

    .actions { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; color: var(--muted); font-size: .95rem; }
    .btn {
      display: inline-block; padding: .55rem 1.1rem; border-radius: 10px;
      background: var(--accent); color: #fff; text-decoration: none; font-weight: 700;
    }
    .btn:hover { background: var(--accent-hover); }

    footer {
      padding: 1.5rem 1rem; text-align: center; font-size: .9rem; color: var(--muted);
      border-top: 1px solid var(--line);
    }
    footer p { margin: .1rem 0; }
  </style>
</head>
<body>

      <a href="index.html#vpn">VPN</a>
      <a href="index.html#mas-juegos">Más juegos</a>
    </nav>
  </header>

  <main>
    <section>
      <h1>LUCCA <span>Proxy</span></h1>
      <p class="lead">Abre sitios a través de LUCCA sin salir de esta página.</p>
    </section>

    <div class="frame-wrap">
      <div class="loading">
        <strong>Cargando LUCCA Proxy…</strong>
        <span>La primera vez puede tardar hasta un minuto.</span>
      </div>
      <iframe
        class="proxy-frame"
        src="https://lucca-proxy.onrender.com"
        title="LUCCA Proxy"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write">
      </iframe>
    </div>

    <div class="actions">
      <span>¿No carga o no te deja entrar?</span>
      <a class="btn" href="https://lucca-proxy.onrender.com">Abrir en su propia página</a>
    </div>
  </main>

  <footer>
    <p>LUCCA © 2026 · Tu espacio digital</p>
    <p>Versión 1.0</p>
  </footer>

</body>
</html>
